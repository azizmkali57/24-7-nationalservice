<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 180" width="100%" height="100%">
  <defs>
    <!-- Headset Ear-Cup Dynamic Blue Gradient -->
    <linearGradient id="earcupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="45%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#082F49" />
    </linearGradient>

    <!-- Speed Dial Arrow Dynamic Blue to Cyan Gradient -->
    <linearGradient id="arrowArcGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="60%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Number 7 India Tricolour Diagonal Gradient -->
    <linearGradient id="tricolourGrad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="40%" stop-color="#FB923C" />
      <stop offset="55%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>

    <!-- Number 7 Top Bar Solid Bright Blue -->
    <linearGradient id="sevenTopGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
  </defs>

  <!-- Left Circular Headset & 247 Speed-Dial Emblem -->
  <g id="emblemGroup">
    <!-- Speedometer Clock Ticks (White on dark, Navy on light) -->
    <g class="clock-ticks" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.85">
      <line x1="110" y1="36" x2="110" y2="44" />
      <line x1="134" y1="44" x2="130" y2="51" />
      <line x1="154" y1="62" x2="148" y2="67" />
      <line x1="86" y1="44" x2="90" y2="51" />
      <line x1="68" y1="64" x2="74" y2="68" />
    </g>

    <!-- Center Clock Pivot and Hand Indicator -->
    <g class="clock-hand">
      <circle cx="108" cy="65" r="5" fill="#FFFFFF" />
      <line x1="108" y1="65" x2="127" y2="42" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- Cyan/Blue Speedometer Arc with Arrow Head -->
    <g class="speed-arc">
      <path d="M 64 68 A 54 54 0 0 1 158 54" fill="none" stroke="url(#arrowArcGrad)" stroke-width="6" stroke-linecap="round" />
      <!-- Arrow Head pointing down-right -->
      <polygon points="152,43 166,56 150,64" fill="#0EA5E9" />
    </g>

    <!-- Customer Support Headset Band & Microphone -->
    <!-- Headband arc wrapping around the dial -->
    <path d="M 40 85 A 64 64 0 0 1 125 15" fill="none" stroke="#FFFFFF" class="headset-band" stroke-width="6" stroke-linecap="round" />
    
    <!-- Left Ear Cushion -->
    <rect x="22" y="70" width="18" height="50" rx="9" fill="url(#earcupGrad)" stroke="#FFFFFF" stroke-width="1.5" />
    
    <!-- Microphone Arm curving to mouth -->
    <path d="M 38 108 C 40 142, 70 152, 98 152" fill="none" stroke="#FFFFFF" class="mic-arm" stroke-width="5" stroke-linecap="round" />
    <rect x="94" y="145" width="22" height="14" rx="7" fill="#FFFFFF" class="mic-capsule" />

    <!-- Big Bold 247 Numbers -->
    <!-- Number 2 -->
    <text x="47" y="125" font-family="'Poppins', 'Arial Black', sans-serif" font-weight="900" font-size="64" fill="#FFFFFF" class="num-white" letter-spacing="-2">2</text>
    <!-- Number 4 -->
    <text x="82" y="125" font-family="'Poppins', 'Arial Black', sans-serif" font-weight="900" font-size="64" fill="#FFFFFF" class="num-white" letter-spacing="-2">4</text>
    
    <!-- Number 7 with Blue Top Bar & India Tricolour Leg -->
    <!-- Top Horizontal Bar of 7 -->
    <path d="M 132 75 L 168 75 L 168 87 L 146 87 Z" fill="url(#sevenTopGrad)" />
    <!-- Diagonal Slanted Leg of 7 with Indian Flag Gradient -->
    <polygon points="146,87 168,87 137,135 125,135" fill="url(#tricolourGrad)" />
  </g>

  <!-- Right Typography: Customer Support - INDIA - -->
  <g transform="translate(186, 0)">
    <!-- 'Customer' line -->
    <text x="0" y="80" font-family="'Poppins', 'Montserrat', sans-serif" font-weight="800" font-size="34" letter-spacing="-0.8" fill="#FFFFFF" class="text-customer">
      Customer
    </text>
    
    <!-- 'Support' line -->
    <text x="0" y="120" font-family="'Poppins', 'Montserrat', sans-serif" font-weight="800" font-size="36" letter-spacing="-0.8" fill="#FFFFFF" class="text-support">
      Support
    </text>

    <!-- Subtitle: — INDIA — -->
    <g transform="translate(0, 142)">
      <line x1="0" y1="-5" x2="32" y2="-5" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" />
      <text x="40" y="0" font-family="'Inter', sans-serif" font-weight="700" font-size="16" letter-spacing="7" fill="#94A3B8" class="text-india">
        INDIA
      </text>
      <line x1="126" y1="-5" x2="160" y2="-5" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" />
    </g>
  </g>
</svg>
